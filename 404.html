<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Roversa Adventure Quest</title>
  <!-- Each game screen has its own address for visitor counts (see README).
       Refreshing or sharing one lands here. The three main screens
       (adventures, dice-quest, roversa-robot) reopen that screen; any other
       address goes back to the game's start.
       On play.roversa.com the game is at the root (/level-3); on GitHub Pages
       it is in a folder (/roversa-adventure-quest-online/level-3). -->
  <script>
    var parts = location.pathname.split('/');
    var inFolder = /\.github\.io$/.test(location.hostname);
    var base = inFolder ? '/' + parts[1] + '/' : '/';
    var screen = (inFolder ? parts[2] : parts[1]) || '';
    var main = ['adventures', 'dice-quest', 'roversa-robot'].indexOf(screen) >= 0;
    location.replace(base + location.search + (main && !location.hash ? '#' + screen : location.hash));
  </script>
</head>
<body>
  <p><a href="./">Roversa Adventure Quest</a></p>
</body>
</html>
