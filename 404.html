<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Roversa Adventure Quest</title>
  <!-- Each game screen has its own address for visitor counts (see README).
       Refreshing or sharing one lands here. The three main screens
       (adventures, dice-quest, roversa-robot) reopen that screen; any other
       address goes back to the game's start. -->
  <script>
    var parts = location.pathname.split('/');
    var screen = parts[2] || '';
    var main = ['adventures', 'dice-quest', 'roversa-robot'].indexOf(screen) >= 0;
    location.replace('/' + parts[1] + '/' + location.search + (main && !location.hash ? '#' + screen : location.hash));
  </script>
</head>
<body>
  <p><a href="/roversa-adventure-quest-online/">Roversa Adventure Quest</a></p>
</body>
</html>
