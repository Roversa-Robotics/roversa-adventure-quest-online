# Publishes the game to GitHub Pages on every merge to main.
# tools/build.sh stamps the commit id into the files (replacing __BUILD__), so
# each release loads matching files and installed apps notice the update. The
# same script builds the Cloudflare Pages copy at play.roversa.com. See README.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the game and stamp the build
        env:
          # The Dice Quest relay's address (Settings > Secrets and variables >
          # Actions > Variables). Empty hides "Play on 2-4 devices".
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: bash tools/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
